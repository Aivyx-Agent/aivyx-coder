# cargo-deny configuration — dependency license policy.
#
# Run: `cargo deny check licenses`
#
# aivyx-coder relicenses MIT OR Apache-2.0 -> BUSL-1.1 (see LICENSE). For
# that to be lawful, NO dependency may impose copyleft (GPL/LGPL-only/
# AGPL/MPL/SSPL/EPL/CDDL) on the combined work. This allow-list is
# therefore permissive-only and deliberately omits every copyleft
# license: cargo-deny rejects anything not listed, so a future copyleft
# dep fails the gate loudly instead of silently poisoning the relicense.
#
# The list matches aivyx-pa's own established allow-list exactly (that
# repo went through this same relicense first, and its own audit found a
# real GPL-3.0 blocker before settling on this list) — reused rather
# than redrafted so both repos apply the identical policy.

[graph]
all-features = true

[licenses]
version = 2
# Skip aivyx-coder's OWN workspace crates: they relicense to BUSL-1.1
# (this gate's whole purpose), so they must not be measured against the
# dependency allow-list below. Scoped to first-party crates marked
# publish = false (see [workspace.package], set in Task 2 of this
# plan) -- a THIRD-PARTY crate under BUSL/any copyleft still fails
# loudly, which is the point.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "NCSA",
    # MPL-2.0 is *file-level* (weak) copyleft: it never relicenses the
    # larger combined work -- the only obligation is to share
    # modifications to the MPL-licensed files themselves, which we never
    # touch (they are upstream crates: the servo CSS stack --
    # cssparser/selectors/dtoa-short -- pulled transitively via the
    # `scraper` crate). Fully compatible with shipping aivyx-coder under
    # BUSL-1.1. Verified directly: `cargo deny check licenses
    # --all-features` is green with this allow-list and no exceptions.
    "MPL-2.0",
]

# No per-crate license exceptions. `cargo deny check licenses`
# (all-features) is green with no exceptions -- verified directly
# against this exact allow-list before this file was committed. Any
# future copyleft dep now fails the gate loudly.

[advisories]
version = 2
# New advisories fail CI. Unmaintained crates are reported too, so they
# surface; accepted ones go in `ignore` with the reason.
yanked = "deny"
unmaintained = "all"
ignore = [
    # fxhash — RUSTSEC-2025-0057 (unmaintained). Pulled via
    #   fxhash → bm25 → mistralrs-core → mistralrs → aivyx-llm
    # (the in-process mistralrs local-LLM provider). Same path as aivyx-pa.
    { id = "RUSTSEC-2025-0057", reason = "unmaintained, not vulnerable; transitive under mistralrs (bm25 → mistralrs-core → aivyx-llm); awaiting upstream" },

    # number_prefix — RUSTSEC-2025-0119 (unmaintained). Pulled via
    #   number_prefix → indicatif 0.17 → hf-hub → mistralrs-core → mistralrs
    # Same path as aivyx-pa.
    { id = "RUSTSEC-2025-0119", reason = "unmaintained, not vulnerable; transitive under mistralrs (indicatif → hf-hub → mistralrs-core → aivyx-llm); awaiting upstream" },

    # paste — RUSTSEC-2024-0436 (unmaintained proc-macro). Pulled via
    #   paste → gemm → candle-core → mistralrs → aivyx-llm
    # (aivyx-pa reaches it through frankenstein instead; the root is
    # different here but the disposition is the same).
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, not vulnerable; transitive under gemm/candle-core (mistralrs → aivyx-llm); awaiting upstream" },

    # zip — RUSTSEC-2026-0367/0368/0369. zip 7.2.0 via
    #   zip → candle-core → mistralrs → aivyx-llm
    # candle-core only calls ZipArchive::new / by_name to read .npz and
    # .pth weight files in memory; it never calls extract.
    { id = "RUSTSEC-2026-0367", reason = "zip 7.2.0 via candle-core (mistralrs, aivyx-llm local provider); the advisory is about ZipArchive::extract, which candle never calls (it reads npz/pth archives in memory); fixed only in zip 9, revisit when candle-core/mistralrs move" },
    { id = "RUSTSEC-2026-0368", reason = "zip 7.2.0 via candle-core (mistralrs, aivyx-llm local provider); the advisory is about ZipArchive::extract, which candle never calls (it reads npz/pth archives in memory); fixed only in zip 9, revisit when candle-core/mistralrs move" },
    { id = "RUSTSEC-2026-0369", reason = "zip 7.2.0 via candle-core (mistralrs, aivyx-llm local provider); the advisory is about ZipArchive::extract, which candle never calls (it reads npz/pth archives in memory); fixed only in zip 9, revisit when candle-core/mistralrs move" },
]
