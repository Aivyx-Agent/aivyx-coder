[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.3"
edition = "2024"
license = "BUSL-1.1"
publish = false

[workspace.dependencies]
# `default-features = false` on aivyx-acp/aivyx-core/aivyx-mcp-server/
# aivyx-sandbox/aivyx-tools/aivyx-tui below: no crate currently pulls
# these in via `{ workspace = true }` (each still sets its own
# `default-features = false` at its own call site instead), so this isn't
# fixing an active bug -- it's a latent-gap hardening. Without it, a
# future crate adopting the more idiomatic `{ workspace = true }` style
# would silently default these features back on, reintroducing the
# Linux-only landlock/seccompiler deps into a macOS build without
# touching any file the feature-forwarding fix changed.
aivyx-acp = { path = "crates/aivyx-acp", default-features = false }
aivyx-types = { path = "crates/aivyx-types" }
aivyx-llm = { path = "crates/aivyx-llm" }
aivyx-mcp-server = { path = "crates/aivyx-mcp-server", default-features = false }
aivyx-sandbox = { path = "crates/aivyx-sandbox", default-features = false }
aivyx-tools = { path = "crates/aivyx-tools", default-features = false }
aivyx-repomap = { path = "crates/aivyx-repomap" }
aivyx-core = { path = "crates/aivyx-core", default-features = false }
aivyx-config = { path = "crates/aivyx-config" }
aivyx-tui = { path = "crates/aivyx-tui", default-features = false }
# Not on crates.io -- pinned by commit SHA (see each repo's own README).
# Centralized here (rather than repeated per-crate) so each pin has
# exactly one place to bump: aivyx-kvcache and aivyx-recall previously
# had the identical git/rev pair duplicated across 3 Cargo.tomls each,
# which a partial bump could silently desync.
aivyx-confine = { git = "https://github.com/Aivyx-Agent/aivyx-confine", rev = "7de5380de0b861e47d51d56342b521b75f194c34", default-features = false }
aivyx-checkpoint = { git = "https://github.com/Aivyx-Agent/aivyx-checkpoint", rev = "a41da4090a99813c95d69361f94504f07bca52cb" }
aivyx-kvcache = { git = "https://github.com/Aivyx-Agent/aivyx-kvcache", rev = "4ec85e4d887a6f0de2318baf1fa4d7e9023a1ffc" }
aivyx-recall = { git = "https://github.com/Aivyx-Agent/aivyx-recall", rev = "f883339ee9655871673c75343b1773b7836f465b" }
aivyx-injection-guard = { git = "https://github.com/Aivyx-Agent/aivyx-injection-guard", rev = "a506c9c961b82715806bdec67e53704f1a11ed8d" }
aivyx-skills = { git = "https://github.com/Aivyx-Agent/aivyx-skills", rev = "ffaff98acf1bd32955e6abdb659444215218416e" }
aivyx-route = { git = "https://github.com/Aivyx-Agent/aivyx-route", rev = "1ab893732e07daca13d37ea2a1695b229c058a20" }
# The signed pack format shared with aivyx-pa (config packs). Not on
# crates.io -- pinned by commit SHA like the others; MUST stay public.
aivyx-pack = { git = "https://github.com/Aivyx-Agent/aivyx-pack", rev = "eedbf350820c0483c6a1649de4c83bb1a45844ad" }
# Not on crates.io -- pinned by commit SHA, same as aivyx-checkpoint/
# aivyx-confine/aivyx-injection-guard above. No platform-specific
# backend, so no target-gating needed. All three pinned to the same rev
# (Milestone 2 Pass A's merge commit in that repo) so they never drift
# out of lockstep with each other.
aivyx-vision-svg = { git = "https://github.com/Aivyx-Agent/aivyx-vision", rev = "226663984b64fe2832afb58158b6ad9be1414c9e" }
aivyx-vision-core = { git = "https://github.com/Aivyx-Agent/aivyx-vision", rev = "226663984b64fe2832afb58158b6ad9be1414c9e" }
aivyx-vision-mold = { git = "https://github.com/Aivyx-Agent/aivyx-vision", rev = "226663984b64fe2832afb58158b6ad9be1414c9e" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
