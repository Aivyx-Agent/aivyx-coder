[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aivyx-acp = { path = "crates/aivyx-acp" }
aivyx-types = { path = "crates/aivyx-types" }
aivyx-llm = { path = "crates/aivyx-llm" }
aivyx-mcp-server = { path = "crates/aivyx-mcp-server" }
aivyx-sandbox = { path = "crates/aivyx-sandbox" }
aivyx-tools = { path = "crates/aivyx-tools" }
aivyx-repomap = { path = "crates/aivyx-repomap" }
aivyx-core = { path = "crates/aivyx-core" }
aivyx-config = { path = "crates/aivyx-config" }
aivyx-tui = { path = "crates/aivyx-tui" }
# Not on crates.io -- pinned by commit SHA (see each repo's own README).
# Centralized here (rather than repeated per-crate) so each pin has
# exactly one place to bump: aivyx-kvcache and aivyx-recall previously
# had the identical git/rev pair duplicated across 3 Cargo.tomls each,
# which a partial bump could silently desync.
aivyx-confine = { git = "https://github.com/Aivyx-Agent/aivyx-confine", rev = "9a9ea5b96e6f97bc196722ebae4c46f61b4750a4", default-features = false }
aivyx-checkpoint = { git = "https://github.com/Aivyx-Agent/aivyx-checkpoint", rev = "37b0ebf200eaf5b31bcb795dfb1beb3356cd12a3" }
aivyx-kvcache = { git = "https://github.com/Aivyx-Agent/aivyx-kvcache", rev = "e1b06c9960ee98841d9b91978a11dd99ed388490" }
aivyx-recall = { git = "https://github.com/Aivyx-Agent/aivyx-recall", rev = "e22e28ac9dbcc051b9564c690d5082f79a51cf03" }
aivyx-injection-guard = { git = "https://github.com/Aivyx-Agent/aivyx-injection-guard", rev = "ad9141c6ca242532db7b8e34eff423084e1eba4d" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
