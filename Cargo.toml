[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aivyx-types = { path = "crates/aivyx-types" }
aivyx-llm = { path = "crates/aivyx-llm" }
aivyx-sandbox = { path = "crates/aivyx-sandbox" }
aivyx-tools = { path = "crates/aivyx-tools" }
aivyx-repomap = { path = "crates/aivyx-repomap" }
aivyx-core = { path = "crates/aivyx-core" }
aivyx-config = { path = "crates/aivyx-config" }
aivyx-tui = { path = "crates/aivyx-tui" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
