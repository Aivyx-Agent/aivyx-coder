name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            stage_suffix: x86_64-linux-musl
          - target: aarch64-apple-darwin
            runner: macos-14
            stage_suffix: darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl cross-compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary (Linux, musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p aivyx

      - name: Build release binary (macOS, no sandbox-backend)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }} -p aivyx --no-default-features

      - name: Package release artifact
        env:
          # macOS's tar emits `._*` AppleDouble sidecar files for anything
          # carrying extended attributes unless this is set; harmless on
          # the Linux leg (its tar doesn't look at this var), scoped by
          # expression anyway so it's only ever set on the macOS leg.
          COPYFILE_DISABLE: ${{ matrix.target == 'aarch64-apple-darwin' && '1' || '' }}
        run: |
          STAGE_NAME="aivyx-coder-${GITHUB_REF_NAME}-${{ matrix.stage_suffix }}"
          mkdir -p "dist/${STAGE_NAME}"
          cp target/${{ matrix.target }}/release/aivyx-coder "dist/${STAGE_NAME}/aivyx-coder"
          cp README.md LICENSE "dist/${STAGE_NAME}/"
          cp -r LICENSES "dist/${STAGE_NAME}/"
          mkdir -p "dist/${STAGE_NAME}/docs"
          cp -r docs/logos "dist/${STAGE_NAME}/docs/"
          cd dist
          tar -czf "${STAGE_NAME}.tar.gz" "${STAGE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE_NAME}.tar.gz" > "${STAGE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE_NAME}.tar.gz" > "${STAGE_NAME}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.stage_suffix }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
