[package]
name = "aivyx"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aivyx-coder"
path = "src/main.rs"

[dependencies]
aivyx-acp = { version = "0.1.0", path = "../aivyx-acp" }
aivyx-config = { version = "0.1.0", path = "../aivyx-config" }
aivyx-core = { version = "0.1.0", path = "../aivyx-core" }
aivyx-kvcache = { workspace = true }
aivyx-llm = { version = "0.1.0", path = "../aivyx-llm" }
aivyx-mcp-server = { version = "0.1.0", path = "../aivyx-mcp-server" }
aivyx-recall = { workspace = true }
aivyx-repomap = { version = "0.1.0", path = "../aivyx-repomap" }
aivyx-sandbox = { version = "0.1.0", path = "../aivyx-sandbox" }
aivyx-tools = { version = "0.1.0", path = "../aivyx-tools" }
aivyx-tui = { version = "0.1.0", path = "../aivyx-tui" }
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1.0.150"
shell-escape = "0.1.5"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
agent-client-protocol = "2.0.0"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "time", "test-util"] }
