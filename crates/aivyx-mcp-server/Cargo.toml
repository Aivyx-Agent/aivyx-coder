[package]
name = "aivyx-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "0.11.0", features = ["transport-io"] }
aivyx-core = { version = "0.1.0", path = "../aivyx-core", default-features = false }
aivyx-kvcache = { workspace = true }
aivyx-sandbox = { version = "0.1.0", path = "../aivyx-sandbox", default-features = false }
aivyx-tools = { version = "0.1.0", path = "../aivyx-tools", default-features = false }
aivyx-llm = { version = "0.1.0", path = "../aivyx-llm" }
aivyx-repomap = { version = "0.1.0", path = "../aivyx-repomap" }
anyhow = "1.0.103"
async-trait = "0.1.89"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tokio-util = "0.7.18"
uuid = { version = "1", features = ["v4"] }

[features]
# Real OS-level confinement (Landlock filesystem scoping + a seccomp-bpf
# syscall denylist), forwarded from aivyx-sandbox. Opt out with
# --no-default-features on platforms/kernels where it isn't available
# (e.g. macOS) -- NoopConfiner remains the fallback. This crate must
# forward the feature explicitly: depending on aivyx-sandbox without
# default-features = false means --no-default-features never actually
# reaches aivyx-sandbox's own sandbox-backend feature, no matter how
# this crate itself is built. Also forwards through aivyx-core and
# aivyx-tools (which this crate depends on and which themselves
# re-forward sandbox-backend) -- those dependency edges also needed
# default-features = false, since an unguarded edge implicitly requests
# the dependency's own default feature regardless of this crate's own
# feature flags.
default = ["sandbox-backend"]
sandbox-backend = [
    "aivyx-sandbox/sandbox-backend",
    "aivyx-core/sandbox-backend",
    "aivyx-tools/sandbox-backend",
]

[dev-dependencies]
# Only used by test-only LlmBackend mocks (BoxStream, StreamExt,
# executor::block_on) -- mirrors aivyx-core's own delegate.rs test module,
# which uses the same crate the same way.
futures = "0.3"
# Only used by tiers.rs's own real-tool-name test (constructs a real
# MemoryWriteTool/MemoryForgetTool via InMemoryRecall to assert their
# Tool::name() matches the tier's hardcoded exclusion strings) -- same
# pinned rev aivyx-tools itself depends on (now centralized in the
# workspace root's [workspace.dependencies]).
aivyx-recall = { workspace = true }
# Only used by tiers.rs's own real-tool-name test, to construct a real
# GenerateSvgTool (via a minimal fake TextCompleter) and assert its
# Tool::name() matches the tier's hardcoded exclusion string, same
# rationale as aivyx-recall directly above.
aivyx-vision-svg = { workspace = true }
# Only used by the cutoff-notice test's scripted ToolCallComplete event
# (ToolCall/ToolCallId/ToolCallSource) -- Cargo requires this be a direct
# dependency of this crate even though aivyx-core already depends on it;
# a transitive dependency's types are not importable without it.
aivyx-types = { version = "0.1.0", path = "../aivyx-types" }
