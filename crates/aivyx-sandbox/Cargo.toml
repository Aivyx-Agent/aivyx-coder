[package]
name = "aivyx-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.89"
landlock = { version = "0.4.5", optional = true }
libc = { version = "0.2.186", optional = true }
seccompiler = { version = "0.5.0", optional = true }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["process"] }
tracing = "0.1.44"

[features]
default = ["sandbox-backend"]
# Real OS-level confinement (Landlock filesystem scoping + a seccomp-bpf
# syscall denylist) for process-executing tools. Opt out with
# `--no-default-features` on platforms/kernels where it isn't available —
# `NoopConfiner` remains the fallback.
sandbox-backend = ["dep:landlock", "dep:libc", "dep:seccompiler"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
