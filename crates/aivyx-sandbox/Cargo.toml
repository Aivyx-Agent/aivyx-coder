[package]
name = "aivyx-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aivyx-confine = { workspace = true }
async-trait = "0.1.89"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["fs", "macros", "process", "time"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["sandbox-backend"]
# Real OS-level confinement (Landlock filesystem scoping + a seccomp-bpf
# syscall denylist) for process-executing tools. Opt out with
# `--no-default-features` on platforms/kernels where it isn't available —
# `NoopConfiner` remains the fallback.
sandbox-backend = ["aivyx-confine/sandbox-backend"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
