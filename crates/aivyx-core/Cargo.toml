[package]
name = "aivyx-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aivyx-kvcache = { git = "https://github.com/Aivyx-Agent/aivyx-kvcache", rev = "e1b06c9960ee98841d9b91978a11dd99ed388490" }
aivyx-llm = { version = "0.1.0", path = "../aivyx-llm" }
aivyx-repomap = { version = "0.1.0", path = "../aivyx-repomap" }
aivyx-sandbox = { version = "0.1.0", path = "../aivyx-sandbox" }
aivyx-tools = { version = "0.1.0", path = "../aivyx-tools" }
aivyx-types = { version = "0.1.0", path = "../aivyx-types" }
async-trait = "0.1.89"
directories = "6.0.0"
futures = "0.3.32"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["parsing", "formatting", "serde"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.18"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
# Only used by the kvcache regression tests in agent/tests.rs -- fakes
# llama-server's /slots HTTP endpoints so ensure_kv_slot_checked_out's
# restore/warm-up/save flow can be driven end-to-end without a real
# server. Same version aivyx-kvcache's own test suite already pins.
wiremock = "0.6.5"
