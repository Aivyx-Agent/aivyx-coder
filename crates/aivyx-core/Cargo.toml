[package]
name = "aivyx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aivyx-kvcache = { workspace = true }
aivyx-llm = { version = "0.2.0", path = "../aivyx-llm" }
aivyx-repomap = { version = "0.2.0", path = "../aivyx-repomap" }
aivyx-sandbox = { version = "0.2.0", path = "../aivyx-sandbox", default-features = false }
aivyx-team = { version = "0.2.0", path = "../aivyx-team" }
aivyx-tools = { version = "0.2.0", path = "../aivyx-tools", default-features = false }
aivyx-types = { version = "0.2.0", path = "../aivyx-types" }
async-trait = "0.1.89"
directories = "6.0.0"
futures = "0.3.32"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["parsing", "formatting", "serde"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }

[features]
# Real OS-level confinement (Landlock filesystem scoping + a seccomp-bpf
# syscall denylist), forwarded from aivyx-sandbox. Opt out with
# --no-default-features on platforms/kernels where it isn't available
# (e.g. macOS) -- NoopConfiner remains the fallback. This crate must
# forward the feature explicitly: depending on aivyx-sandbox without
# default-features = false means --no-default-features never actually
# reaches aivyx-sandbox's own sandbox-backend feature, no matter how
# this crate itself is built. Also forwards through aivyx-tools (which
# this crate depends on and which itself re-forwards sandbox-backend) --
# that dependency edge also needed default-features = false, since an
# unguarded edge implicitly requests aivyx-tools' own default feature
# regardless of this crate's own feature flags.
default = ["sandbox-backend"]
sandbox-backend = ["aivyx-sandbox/sandbox-backend", "aivyx-tools/sandbox-backend"]

[dev-dependencies]
tempfile = "3.27.0"
# Only used by the kvcache regression tests in agent/tests.rs -- fakes
# llama-server's /slots HTTP endpoints so ensure_kv_slot_checked_out's
# restore/warm-up/save flow can be driven end-to-end without a real
# server. Same version aivyx-kvcache's own test suite already pins.
wiremock = "0.6.5"
