[package]
name = "aivyx-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aivyx-sandbox = { version = "0.1.0", path = "../aivyx-sandbox" }
aivyx-types = { version = "0.1.0", path = "../aivyx-types" }
async-trait = "0.1.89"
futures = "0.3.32"
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.27"
libc = "0.2.186"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "3.1.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tokio = { version = "1.52.3", features = ["process", "fs", "rt", "macros", "io-util", "time"] }
tokio-util = "0.7.18"

[dev-dependencies]
tempfile = "3.27.0"
