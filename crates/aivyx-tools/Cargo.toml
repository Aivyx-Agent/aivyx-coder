[package]
name = "aivyx-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aivyx-checkpoint = { workspace = true }
aivyx-recall = { workspace = true }
aivyx-skills = { workspace = true }
aivyx-llm = { version = "0.1.0", path = "../aivyx-llm" }
aivyx-sandbox = { version = "0.1.0", path = "../aivyx-sandbox", default-features = false }
aivyx-types = { version = "0.1.0", path = "../aivyx-types" }
aivyx-vision-svg = { workspace = true }
aivyx-vision-core = { workspace = true }
async-trait = "0.1.89"
diffy = "0.5.1"
futures = "0.3.32"
globset = "0.4.18"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
html2text = "0.6"
ignore = "0.4.27"
libc = "0.2.186"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "stream", "rustls"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "3.1.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tokio = { version = "1.52.3", features = ["process", "fs", "rt", "macros", "io-util", "time", "sync", "net"] }
tokio-util = "0.7.18"

[features]
# Real OS-level confinement (Landlock filesystem scoping + a seccomp-bpf
# syscall denylist), forwarded from aivyx-sandbox. Opt out with
# --no-default-features on platforms/kernels where it isn't available
# (e.g. macOS) -- NoopConfiner remains the fallback. This crate must
# forward the feature explicitly: depending on aivyx-sandbox without
# default-features = false means --no-default-features never actually
# reaches aivyx-sandbox's own sandbox-backend feature, no matter how
# this crate itself is built.
default = ["sandbox-backend"]
sandbox-backend = ["aivyx-sandbox/sandbox-backend"]

[dev-dependencies]
tempfile = "3.27.0"
# aivyx-vision-core's `FakeGenerationProvider` test double is gated behind
# its own `testing` Cargo feature (`#[cfg(any(test, feature = "testing"))]`
# in that crate -- `test` there only applies to aivyx-vision-core's own
# `cargo test`, not to this crate's). Listed here, in [dev-dependencies]
# only, so the feature is enabled for this crate's own test builds
# without leaking into normal (non-test) builds of aivyx-tools or
# anything that depends on it.
aivyx-vision-core = { workspace = true, features = ["testing"] }
