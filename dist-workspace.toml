[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist), which builds the release archives and the
# one-line installer (`aivyx-coder-installer.sh`) on each version tag. Same
# version and conventions as aivyx-pa's.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# The two targets coder has always shipped (and the ACP registry entry
# lists). Every target builds with the default features: aivyx-confine's
# Landlock + seccomp backend compiles away off Linux, so macOS no longer
# needs --no-default-features.
targets = ["x86_64-unknown-linux-musl", "aarch64-apple-darwin"]
# Where the installer puts the binary: ~/.cargo/bin, as for aivyx-pa, so one
# PATH entry covers both products.
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The installer's last word is the next step. Plain text only: it's embedded
# in the generated shell script, so no backticks or quotes.
install-success-msg = "aivyx-coder is installed. Start a local model server, then run aivyx-coder in your project folder (if your shell says command not found, open a new terminal first)"
# .tar.gz rather than .tar.xz: the ACP registry's installers read gzip.
unix-archive = ".tar.gz"
# Third-party licence texts ship beside the binary (README and LICENSE are
# picked up automatically from the workspace root).
include = ["LICENSES/"]
# Build only the packages that ship an artifact (aivyx-coder).
precise-builds = true
# The release pipeline runs on version tags only; ci.yml covers PRs.
pr-run-mode = "skip"

# GitHub retired the macos-14 image on 2026-11-02, and dist 0.31 still picks
# it for aarch64-apple-darwin.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
